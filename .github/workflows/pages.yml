name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Tests (no se publica si fallan)
        run: pytest
      - name: Generar sitio estático
        env:
          # Configurable en Settings → Secrets and variables → Actions → Variables
          MARMARULA_WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER || '573000000000' }}
          MARMARULA_INSTAGRAM_USER: ${{ vars.INSTAGRAM_USER || 'marmarula' }}
        run: python -m app.build_static --out dist --base "/${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
