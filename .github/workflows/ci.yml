name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Seguridad del código (bandit)
        run: bandit -q -c pyproject.toml -r app
      - name: Vulnerabilidades en dependencias (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Tests
        run: pytest
